name: UI tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  ui:
    name: UI (${{ matrix.segment }})
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    needs: unit
    strategy:
      fail-fast: true
      matrix:
        include:
          - segment: core
            script: test:ui:core
          - segment: blending
            script: test:ui:blending
          - segment: settings
            script: test:ui:settings
          - segment: results
            script: test:ui:results
          - segment: data
            script: test:ui:data
          - segment: layout
            script: test:ui:layout
          - segment: screenshots
            script: test:ui:screenshots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run ${{ matrix.segment }} UI tests
        run: npm run ${{ matrix.script }} -- --max-failures=1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.segment }}
          path: |
            playwright-report/
            test-results/
